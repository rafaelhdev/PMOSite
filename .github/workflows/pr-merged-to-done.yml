name: Move linked issues to Done on merge to main

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  move-to-done:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Move linked issues to Done
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const projectId = "PVT_kwHOAzheV84BUgDS";
            const statusFieldId = "PVTSSF_lAHOAzheV84BUgDSzhBnvKI";
            const doneOptionId = "e835a9fb";

            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Get linked issues via closingIssuesReferences
            const result = await github.graphql(`
              query($owner: String!, $repo: String!, $prNumber: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $prNumber) {
                    closingIssuesReferences(first: 20) {
                      nodes {
                        number
                        id
                      }
                    }
                  }
                }
              }
            `, { owner, repo, prNumber });

            const issues = result.repository.pullRequest.closingIssuesReferences.nodes;

            if (issues.length === 0) {
              console.log(`Nenhuma issue linkada à PR #${prNumber}.`);
              return;
            }

            for (const issue of issues) {
              // Add issue to project (caso ainda não esteja)
              const addResult = await github.graphql(`
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                    item { id }
                  }
                }
              `, { projectId, contentId: issue.id });

              const itemId = addResult.addProjectV2ItemById.item.id;

              // Move para Done
              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId,
                    itemId: $itemId,
                    fieldId: $fieldId,
                    value: { singleSelectOptionId: $optionId }
                  }) {
                    projectV2Item { id }
                  }
                }
              `, { projectId, itemId, fieldId: statusFieldId, optionId: doneOptionId });

              console.log(`Issue #${issue.number} movida para Done.`);
            }
